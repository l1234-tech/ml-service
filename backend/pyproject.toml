[project]
name = "ml-service"
version = "0.1.0"
description = "ML-сервис для одобрения ипотеки"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "httpx>=0.27.2",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
credit-api = "api.main:run"

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff НЕ сканирует .venv по умолчанию, но укажем явно для надежности
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# Игнорируем только то, что реально мешает
ignore = [
    "E501",  # Длина строки контролируется formatter'ом
    "W503",  # Устаревшее правило
    "E203",  # Конфликтует с black/ruff format
]
select = ["E", "F", "W", "I"]  # E/F/W=ошибки, I=сортировка импортов

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.9.0",     
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]