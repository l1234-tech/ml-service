[project]
name = "ml-service"
version = "0.1.0"
description = "ML-сервис для одобрения ипотеки"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "httpx>=0.27.2",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
credit-api = "backend.api.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "ml"]

[dependency-groups]
dev = [
    "black>=26.5.0",
    "flake8>=7.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]