on:
  push:
    - workflows: [lint-and-test]
  pull_request:
    - workflows: [lint-and-test]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - uv sync --directory /sourcecraft/workspace/backend --group dev
              - uv run --directory /sourcecraft/workspace/backend black --line-length=100 /sourcecraft/workspace/backend/
              - uv run --directory /sourcecraft/workspace/backend flake8 /sourcecraft/workspace/backend/ --ignore=W292

      - name: train-and-test
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - uv sync --directory /sourcecraft/workspace/backend
              - uv run --directory /sourcecraft/workspace/backend python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

          - name: test-api
            needs: ["train-model"]
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - uv sync --directory /sourcecraft/workspace/backend --group dev
              - uv run --directory /sourcecraft/workspace/backend python -m pytest tests/ -v