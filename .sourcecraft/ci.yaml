on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

workflows:
  lint-and-test:
    tasks:
      # --- LINT & FORMAT CHECK ---
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - uv sync --directory /sourcecraft/workspace/backend --group dev
              
              # Проверяем форматирование (не меняем файлы!)
              # Исключаем .venv и __pycache__ из проверки
              - uv run --directory /sourcecraft/workspace/backend black --line-length=100 --check --exclude='.venv|__pycache__' .
              
              # Линтинг с исключением служебных директорий
              - uv run --directory /sourcecraft/workspace/backend flake8 . \
                --ignore=W292,W503,E203 \
                --max-line-length=100 \
                --exclude=.venv,__pycache__,build,dist,.eggs,*.egg-info \
                --statistics \
                --count

      # --- TRAIN MODEL ---
      - name: train-model
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - uv sync --directory /sourcecraft/workspace/backend
              - uv run --directory /sourcecraft/workspace/backend python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

      # --- RUN TESTS ---
      - name: test-api
        needs: ["train-model"]
        cubes:
          - name: test-api
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - uv sync --directory /sourcecraft/workspace/backend --group dev
              
              # Очищаем артефакты модели перед тестами, 
              # чтобы тест "test_model_status_without_model" проходил корректно
              - rm -rf /sourcecraft/workspace/backend/ml/artifacts/*
              
              - uv run --directory /sourcecraft/workspace/backend python -m pytest tests/ -v