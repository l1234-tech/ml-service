on:
  push:
    - workflows: [lint-and-test]
  pull_request:
    - workflows: [lint-and-test]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install uv && cd backend && uv sync --group dev && uv run black --line-length=100 . && uv run flake8 . --ignore=W292

      - name: train-and-test
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script:
              - pip install uv && cd backend && uv sync && mkdir -p ml/artifacts && uv run python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

          - name: test-api
            needs: ["train-model"]
            image: docker.io/library/python:3.12
            script:
              - pip install uv && cd backend && uv sync --group dev && uv run python -m pytest tests/ -v