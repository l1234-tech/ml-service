on:
  push:
    - workflows: [lint-and-test]
  pull_request:
    - workflows: [lint-and-test]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - cd backend && uv sync --group dev
              - cd backend && uv run black --line-length=100 .
              - cd backend && uv run flake8 . --max-line-length=100 --exclude=__pycache__,ml/artifacts

      - name: train-and-test
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - cd backend && uv sync
              - cd backend && uv run python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

          - name: test-api
            needs: ["train-model"]
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              - cd backend && uv sync --group dev
              - cd backend && uv run python -m pytest tests/ -v