on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
  cubes:
    - name: lint-python
      image: docker.io/library/python:3.12
      script: |
        set -e
        export PYTHONPATH=/sourcecraft/workspace/backend
        pip install uv > /dev/null 2>&1
        uv sync --directory /sourcecraft/workspace/backend --group dev --no-install-project > /dev/null 2>&1
        
        # Black проверяет форматирование
        uv run --directory /sourcecraft/workspace/backend black --line-length=100 --check --exclude='.venv|__pycache__' .
        
        # Flake8 с ЯВНЫМИ настройками (конфиг-файлы игнорируются!)
        uv run --directory /sourcecraft/workspace/backend flake8 . \
          --max-line-length=100 \
          --ignore=W292,W503,E203,E501 \
          --exclude=.venv,__pycache__,build,dist,.eggs,*.egg-info

      - name: train-model
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script: |
              set -e
              export PYTHONPATH=/sourcecraft/workspace/backend
              pip install uv > /dev/null 2>&1
              uv sync --directory /sourcecraft/workspace/backend --no-install-project > /dev/null 2>&1
              uv run --directory /sourcecraft/workspace/backend python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

      - name: test-api
        needs: ["train-model"]
        cubes:
          - name: test-api
            image: docker.io/library/python:3.12
            script: |
              set -e
              export PYTHONPATH=/sourcecraft/workspace/backend
              pip install uv > /dev/null 2>&1
              uv sync --directory /sourcecraft/workspace/backend --group dev --no-install-project > /dev/null 2>&1
              rm -rf /sourcecraft/workspace/backend/ml/artifacts/*
              uv run --directory /sourcecraft/workspace/backend python -m pytest tests/ -v