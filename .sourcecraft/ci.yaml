on:
  push:
    - workflows: [lint-and-test]
  pull_request:
    - workflows: [lint-and-test]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install flake8 black
              - cd backend && flake8 . --max-line-length=100 --exclude=__pycache__,ml/artifacts
              - cd backend && black --check --line-length=100 . --exclude='ml/artifacts'

      - name: train-and-test
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script:
              - pip install pandas numpy scikit-learn joblib matplotlib seaborn
              - cd backend && python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

          - name: test-api
            image: docker.io/library/python:3.12
            script:
              - pip install fastapi uvicorn python-multipart httpx pytest pytest-asyncio pandas numpy scikit-learn joblib
              - cd backend && python -m pytest tests/ -v