on:
  push:
    - workflows: [lint-and-test]
      filter:
        branches: ["main" , "backend"]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install flake8 black
              - flake8 backend/ --max-line-length=100 --exclude=__pycache__,ml/artifacts
              - black --check --line-length=100 backend/ --exclude='ml/artifacts'

      - name: backend-tests
        cubes:
          - name: test-api
            image: docker.io/library/python:3.12
            script:
              - pip install fastapi uvicorn python-multipart httpx pytest pytest-asyncio pandas numpy scikit-learn joblib
              - cd backend && python -m pytest tests/ -v