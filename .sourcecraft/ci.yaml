on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

workflows:
  lint-and-test:
    tasks:
      - name: backend-lint
        cubes:
          - name: lint-python
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              # Добавлен флаг -q для тихой установки
              - uv sync --directory /sourcecraft/workspace/backend --group dev -q
              - uv run --directory /sourcecraft/workspace/backend black --line-length=100 --check --exclude='.venv|__pycache__' .

      - name: train-model
        cubes:
          - name: train-model
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              # Добавлен флаг -q
              - uv sync --directory /sourcecraft/workspace/backend -q
              - uv run --directory /sourcecraft/workspace/backend python ml/train.py
            artifacts:
              paths:
                - backend/ml/artifacts/

      - name: test-api
        needs: ["train-model"]
        cubes:
          - name: test-api
            image: docker.io/library/python:3.12
            script:
              - pip install uv
              # Добавлен флаг -q
              - uv sync --directory /sourcecraft/workspace/backend --group dev -q
              - rm -rf /sourcecraft/workspace/backend/ml/artifacts/*
              - uv run --directory /sourcecraft/workspace/backend python -m pytest tests/ -v